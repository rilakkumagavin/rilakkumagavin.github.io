<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>下江陵｜公版聯絡簿四上</title>


<style>
/* Layout: one 16:9 picture-book stage, ink-and-celadon chrome around it, seal-red accent. */
:root{
  --bg:#e9efed; --panel:#f7faf9; --fg:#1d2a2d; --muted:#56686b; --line:#c9d5d2;
  --accent:#b8402c; --jade:#3f7f70; --chip:#dfe8e5;
  --f-show:"LXGW WenKai TC","Kaiti TC","KaiTi","STKaiti","DFKai-SB","Noto Sans CJK TC",serif;
  --f-poem:"Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","PMingLiU","Songti TC","Noto Sans CJK TC",serif;
  --f-ui:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a1c; --panel:#1a2427; --fg:#e4ecea; --muted:#94a6a6; --line:#2b3a3d;
  --accent:#e0644d; --jade:#79bfad; --chip:#233033; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a1c; --panel:#1a2427; --fg:#e4ecea; --muted:#94a6a6; --line:#2b3a3d;
  --accent:#e0644d; --jade:#79bfad; --chip:#233033; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
header h1{font-family:var(--f-show);font-size:clamp(22px,3.2vw,30px);margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted)}
header a{color:var(--jade);font-weight:600}
.seal{display:inline-grid;place-items:center;width:1.6em;height:1.6em;background:var(--accent);color:#fff;border-radius:4px;font-family:var(--f-poem);font-size:15px;margin-right:6px;vertical-align:.15em}

.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;background:#f4f1e8;container-type:inline-size;box-shadow:0 1px 0 var(--line),0 10px 30px -18px #0007;user-select:none}
.stage:fullscreen{border-radius:0;width:100vw;height:auto;max-height:100vh;margin:auto}
.stage svg.world{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene{opacity:0;transition:opacity .6s}
.scene.on{opacity:1}
.ch{transition:transform 1.3s cubic-bezier(.4,.1,.3,1),opacity .6s;opacity:0}
.ch.on{opacity:1}
.steam{animation:steam 1s infinite ease-out;transform-box:fill-box;transform-origin:center}
.steam:nth-child(2){animation-delay:-.5s}
@keyframes steam{from{opacity:.9;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-50px) scale(1.4)}}
.tear{animation:tear 1.1s infinite ease-in}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(46px);opacity:0}}
.prop{opacity:0;transition:opacity .5s}
.prop.on{opacity:1}
.fly{animation:fly 16s linear infinite}
.fly2{animation:fly 21s linear infinite;animation-delay:-8s}
@keyframes fly{from{transform:translate(1800px,0)}to{transform:translate(-500px,-60px)}}
.wing{transform-box:fill-box;transform-origin:center bottom;animation:flap .5s infinite alternate}
@keyframes flap{to{transform:scaleY(-.6)}}
.drop{stroke:#d7e8f2;stroke-width:4;stroke-linecap:round;animation:drop .6s linear infinite}
@keyframes drop{to{transform:translate(-40px,120px)}}
/* picture-book reveal: elements with class "grow" + data-step="N" fade in once fx-sN is on the stage */
.grow{opacity:0;transition:opacity 1.2s,transform 1.2s;transform-box:fill-box;transform-origin:center bottom}

.ov{position:absolute;pointer-events:none}
.tracker{top:2.2cqw;left:2.2cqw;right:31cqw;display:flex;flex-wrap:wrap;gap:.5cqw;font-family:var(--f-show);transition:opacity .4s}
.tracker span{font-size:1.45cqw;padding:.3cqw .8cqw;white-space:nowrap;border-radius:2cqw;background:#ffffffb0;color:#5a6b6b;border:.12cqw solid #0000;transition:.4s}
.tracker span.cur{background:#b8402c;color:#fff;transform:scale(1.12)}
.tracker span.done{color:#2f6f61;border-color:#2f6f6155}
.verse{top:2cqw;right:2cqw;background:#fffdf6e8;border:.15cqw solid #b8402c55;border-radius:.8cqw;padding:1.3cqw 1.1cqw;writing-mode:vertical-rl;font-family:var(--f-poem);font-weight:600;font-size:var(--vs,2.5cqw);line-height:1.5;color:#3a3a35;transition:opacity .5s}
.verse .ln{margin-left:.3em;transition:color .4s;white-space:nowrap}
.verse .ln.hl{color:#b8402c}
.verse small{display:block;font-family:var(--f-show);font-size:1.4cqw;color:#7b7464;margin-left:.6cqw}
ruby rt{font-size:.36em;font-family:var(--f-ui);font-weight:400;color:#2f6f61}
.pop{top:6cqw;left:50%;transform:translateX(-50%) scale(.85);min-width:22cqw;max-width:46cqw;background:#fffdf7;border:.25cqw solid #2c2c2a;border-radius:1.4cqw;padding:1.2cqw 1.6cqw;box-shadow:0 1.2cqw 2.4cqw -1cqw #0006;opacity:0;transition:.45s;font-size:1.7cqw;color:#222;display:grid;gap:.6cqw;text-align:center;font-family:var(--f-show)}
.pop.on{opacity:1;transform:translateX(-50%) scale(1)}
.pop .hd{justify-self:center;font-family:var(--f-ui);font-weight:700;font-size:1.25cqw;color:#fff;background:#b8402c;border-radius:.6cqw;padding:.25cqw .9cqw}
.pop .big{font-family:var(--f-poem);font-weight:900;font-size:3.6cqw;line-height:1.2}
.pop .sm{font-size:1.4cqw;color:#5d6466}
.pop .row{display:flex;gap:1cqw;justify-content:center;align-items:center;flex-wrap:wrap}
.pop .tag{background:#eef3f1;border-radius:.6cqw;padding:.3cqw .8cqw}
.emote{transform:translate(-50%,-100%);background:#fff;border:.2cqw solid #222;border-radius:1.5cqw;padding:.3cqw 1.1cqw;font-family:var(--f-show);font-weight:700;font-size:2.4cqw;color:#222;opacity:0;transition:opacity .3s;white-space:nowrap}
.emote.on{opacity:1;animation:pop .35s}
@keyframes pop{from{transform:translate(-50%,-80%) scale(.4)}}
.sub{left:6%;right:6%;bottom:2.2cqw;display:flex;justify-content:center}
.sub div{background:#141c1ee0;color:#fff;font-family:var(--f-show);font-size:2.35cqw;line-height:1.5;padding:.9cqw 1.8cqw;border-radius:1cqw;max-width:100%;text-wrap:balance;text-align:center}
.sub b{display:inline-block;background:var(--who,#b8402c);color:#fff;font-size:1.7cqw;padding:.1cqw .9cqw;border-radius:.6cqw;margin-right:.9cqw;vertical-align:.2cqw}
.sub:empty{display:none}
.burst{inset:0;display:grid;place-items:center;font-family:var(--f-show);font-weight:700;font-size:8cqw;color:#b8402c;text-shadow:.3cqw .3cqw 0 #fff,-.3cqw -.3cqw 0 #fff,.3cqw -.3cqw 0 #fff,-.3cqw .3cqw 0 #fff;opacity:0;transition:.4s;transform:scale(.6)}
.burst.on{opacity:1;transform:scale(1)}
.ticker{top:40%;left:50%;transform:translate(-50%,-50%);font-family:var(--f-poem);font-weight:900;font-size:11cqw;color:#b8402c;text-shadow:.4cqw .4cqw 0 #fff;opacity:0}
.ticker.on{opacity:1}
.ticker.tk{animation:tk .5s}
@keyframes tk{from{transform:translate(-50%,-50%) scale(1.6)}}
.titlecard{inset:0;display:grid;place-content:center;justify-items:center;gap:1.2cqw;text-align:center;opacity:0;transition:opacity .6s}
.titlecard.on{opacity:1}
.titlecard .big{font-family:var(--f-poem);font-weight:900;font-size:var(--ts,13cqw);line-height:1.05;color:#222;letter-spacing:.6cqw;text-shadow:.3cqw .3cqw 0 #fff}
.titlecard .tag{font-family:var(--f-show);font-size:3cqw;color:#b8402c;background:#fff9;padding:.2cqw 1.2cqw;border-radius:1cqw}
.titlecard .by{font-family:var(--f-show);font-size:2cqw;color:#4d4a42;background:#fff9;padding:.2cqw 1.2cqw;border-radius:1cqw}
.scroll{left:50%;top:5%;transform:translateX(-50%);background:#fffdf5;border:.25cqw solid #8a6d3b;border-radius:.6cqw;padding:1.8cqw 2.2cqw;writing-mode:vertical-rl;font-family:var(--f-poem);font-weight:600;font-size:var(--ss,3cqw);line-height:1.3;color:#2b2b28;box-shadow:inset 0 0 0 .6cqw #f3e9cf;opacity:0;transition:opacity .6s}
.scroll.on{opacity:1}
.scroll .tt{margin-left:.6em;font-weight:900;font-size:1.2em;color:#b8402c}
.scroll .au{font-family:var(--f-show);font-size:.6em;color:#7b6c4e;text-align:end}
.scroll .ln{transition:color .35s;margin-left:.4em;white-space:nowrap}
.scroll .ln.hl{color:#b8402c}
.scroll .c{transition:.35s;border-radius:50%}
.scroll .c.hide{color:transparent;background:radial-gradient(circle,#0000 52%,#b8402c 54%,#b8402c 60%,#0000 62%)}
.scroll .c.hide rt{visibility:hidden}
.count{right:3cqw;bottom:9cqw;font-family:var(--f-poem);font-weight:900;font-size:6cqw;color:#b8402c;opacity:0}
.count.on{opacity:1}
.fader{inset:0;background:#111;opacity:0;transition:opacity .45s}
.fader.on{opacity:1}

.start{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:1.4cqw;background:#10181acc;color:#fff;text-align:center;padding:4cqw}
.start h2{margin:0;font-family:var(--f-show);font-size:4.2cqw;text-wrap:balance}
.start p{margin:0;font-size:max(12px,1.6cqw);max-width:60cqw;line-height:1.6;color:#d8e2df}
.start[hidden]{display:none}
.start button{font:700 max(15px,2.2cqw) var(--f-show);background:#b8402c;color:#fff;border:0;border-radius:99px;padding:1.1cqw 3.4cqw;cursor:pointer}
.start button:focus-visible{outline:3px solid #fff;outline-offset:3px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button.b,select.b{font:600 14px var(--f-ui);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button.b:hover{border-color:var(--jade)}
button.b:focus-visible,select.b:focus-visible,.chap button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
button.b.main{background:var(--accent);border-color:var(--accent);color:#fff;min-width:84px}
button.b[aria-pressed="false"]{color:var(--muted)}
.chap{display:flex;flex-wrap:wrap;gap:6px}
.chap button{font:600 14px var(--f-show);background:var(--chip);color:var(--fg);border:1px solid transparent;border-radius:99px;padding:6px 13px;cursor:pointer}
.chap button.cur{background:var(--jade);color:#fff}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--jade);transition:width .4s}
.note{color:var(--muted);font-size:13px;line-height:1.6;margin:0}
.note kbd{font:12px var(--f-ui);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel)}

/* render mode: the stage alone, filling a 1920x1080 window, for MP4 recording */
html.render body{background:#000;margin:0;padding:0}
html.render .wrap{max-width:none;padding:0;display:block}
html.render header,html.render .prog,html.render .bar,html.render .note,html.render .start{display:none!important}
html.render .stage{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;box-shadow:none}
html.render :root,html.render{padding:0!important}
@media (prefers-reduced-motion: reduce){.fly,.fly2,.wing,.ch.talk .bob,.steam,.tear{animation:none}.ch{transition-duration:.01s}}

/* ---- v2 人物 ---- */
.ch .bod{transform-box:view-box}
.ch .mth{opacity:0}.ch .m0{opacity:1}
.ch.talk .m0{animation:mA .5s steps(1) infinite}.ch.talk .m1{animation:mB .5s steps(1) infinite}.ch.talk .m2{animation:mC .5s steps(1) infinite}
@keyframes mA{0%{opacity:1}25%{opacity:0}}
@keyframes mB{0%{opacity:0}25%{opacity:1}50%{opacity:0}75%{opacity:1}}
@keyframes mC{0%{opacity:0}50%{opacity:1}75%{opacity:0}}
.ch.talk .hd{animation:nod .6s infinite ease-in-out}
@keyframes nod{0%,100%{transform:none}50%{transform:translateY(-2px) rotate(1.2deg)}}
.ch .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.ch .e-happy,.ch .e-shock,.ch .e-proud,.ch .e-shy,.ch .e-think,.ch .b-sad,.ch .b-angry,.ch .b-think,.ch .mo,.ch .xt{display:none}
.mood-happy .e-norm,.mood-shock .e-norm,.mood-proud .e-norm,.mood-shy .e-norm,.mood-think .e-norm{display:none}
.mood-happy .e-happy,.mood-shock .e-shock,.mood-proud .e-proud,.mood-shy .e-shy,.mood-think .e-think{display:inline}
.mood-sad .b-norm,.mood-angry .b-norm,.mood-think .b-norm,.mood-shock .b-norm{display:none}
.mood-sad .b-sad,.mood-angry .b-angry,.mood-think .b-think,.mood-shock .b-think{display:inline}
.mood-happy .mo-happy,.mood-sad .mo-sad,.mood-shock .mo-shock,.mood-angry .mo-angry,.mood-proud .mo-proud,.mood-shy .mo-sad{display:inline}
.mood-happy .m0,.mood-sad .m0,.mood-shock .m0,.mood-angry .m0,.mood-proud .m0,.mood-shy .m0{opacity:0}
.ch.talk .mo{display:none!important}
.mood-sad .x-tear,.mood-angry .x-steam,.mood-shock .x-sweat,.mood-proud .x-spark,.mood-think .x-q,.mood-shy .x-blush{display:inline}
.tear2{animation:tear 1.1s infinite ease-in}
.steam2{animation:steam 1s infinite ease-out;transform-box:fill-box;transform-origin:center}
/* 手勢：轉動上臂 uL/uR、前臂 fL/fR（旋轉中心就是肩膀、手肘） */
.ch .uL,.ch .uR,.ch .fL,.ch .fR{transition:transform .7s cubic-bezier(.45,0,.2,1)}
.ch .bod{animation:breathe 3.4s infinite ease-in-out}
@keyframes breathe{50%{transform:translateY(-2.5px)}}
.ch .uL{transform:rotate(8deg)}.ch .uR{transform:rotate(-8deg)}
.g-wave .uR{transform:rotate(-150deg)}.g-wave .fR{animation:wv .5s infinite alternate ease-in-out}
@keyframes wv{from{transform:rotate(-25deg)}to{transform:rotate(20deg)}}
.g-point .uR{transform:rotate(-78deg)}.g-point .fR{transform:rotate(-8deg)}
.g-bow .uL{transform:rotate(25deg)}.g-bow .fL{transform:rotate(-129deg)}.g-bow .uR{transform:rotate(-25deg)}.g-bow .fR{transform:rotate(129deg)}
.g-open .uL{transform:rotate(48deg)}.g-open .fL{transform:rotate(-34deg)}.g-open .uR{transform:rotate(-48deg)}.g-open .fR{transform:rotate(34deg)}
.g-hold .uL{transform:rotate(10deg)}.g-hold .fL{transform:rotate(-74deg)}.g-hold .uR{transform:rotate(-10deg)}.g-hold .fR{transform:rotate(74deg)}
.g-chin .uR{transform:rotate(45deg)}.g-chin .fR{transform:rotate(150deg)}
.g-up .uL{transform:rotate(155deg)}.g-up .uR{transform:rotate(-155deg)}
.g-look .uR{transform:rotate(-10deg)}.g-look .fR{transform:rotate(100deg)}
/* 走路：腿交替擺動、身體上下 */
.ch .lgL,.ch .lgR{transition:transform .3s}
.walking .lgL{animation:stepA .42s infinite alternate ease-in-out}.walking .lgR{animation:stepB .42s infinite alternate ease-in-out}
.walking .bod{animation:wbob .21s infinite alternate ease-in-out}
.walking:not([class*="g-"]) .uL{animation:stepB .42s infinite alternate}.walking:not([class*="g-"]) .uR{animation:stepA .42s infinite alternate}
@keyframes stepA{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes stepB{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}
@keyframes wbob{to{transform:translateY(-5px)}}
.dog .tail{transform-box:fill-box;transform-origin:right bottom;animation:wag .35s infinite alternate}
@keyframes wag{to{transform:rotate(-24deg)}}
.ffly{animation:glow 1.6s infinite alternate ease-in-out;filter:drop-shadow(0 0 10px #eaff7a)}
@keyframes glow{from{opacity:.25;transform:translate(0,0)}to{opacity:1;transform:translate(10px,-14px)}}
/* 回憶時光：水墨濾鏡＋卷軸框 */
.stage.fx-flash svg.world{filter:sepia(.55) grayscale(.45) contrast(.95) brightness(1.04)}
.inkframe{inset:0;border:1.6cqw solid #6b5a3e;border-radius:.6cqw;box-shadow:inset 0 0 4cqw #3b2f1f88;opacity:0;transition:opacity .6s}
.inkframe::before,.inkframe::after{content:"";position:absolute;left:-2.4cqw;right:-2.4cqw;height:1.6cqw;background:#8a6d3b;border-radius:1cqw}
.inkframe::before{top:-2.2cqw}.inkframe::after{bottom:-2.2cqw}
.stage.fx-flash .inkframe{opacity:1}
.flashtag{top:3cqw;left:3cqw;font-family:var(--f-show);font-size:2.4cqw;background:#3b2f1fcc;color:#f7ecd2;padding:.4cqw 1.4cqw;border-radius:.6cqw;opacity:0;transition:opacity .5s}
.flashtag.on{opacity:1}
/* 原句字卡 */
.orig{top:4.5cqw;left:50%;transform:translateX(-50%) scale(.6);background:#fffdf5;border:.3cqw solid #b8402c;border-radius:1.2cqw;padding:.8cqw 2.4cqw .6cqw;font-family:var(--f-poem);font-weight:900;font-size:4.6cqw;color:#b8402c;letter-spacing:.3cqw;white-space:nowrap;box-shadow:0 1.2cqw 2.4cqw -1cqw #0007;opacity:0;transition:opacity .4s,transform .5s cubic-bezier(.3,1.4,.5,1)}
.orig.on{opacity:1;transform:translateX(-50%) scale(1)}
.orig rt{font-size:.3em;color:#2f6f61;font-weight:600;letter-spacing:0}
.orig small{display:block;text-align:center;font-family:var(--f-show);font-size:1.3cqw;color:#7b6c4e;font-weight:400;letter-spacing:0}
/* 手機畫面、聊天室、特寫卡 */
.phone{top:7cqw;left:4cqw;width:22cqw;background:#1d1d1f;border-radius:2.4cqw;padding:2.6cqw 1cqw 2.2cqw;opacity:0;transform:translateY(3cqw);transition:.45s}
.phone.on{opacity:1;transform:none}
.phone div{background:#f3f7f9;border-radius:1cqw;padding:1.2cqw;display:grid;gap:.8cqw;font-family:var(--f-show);font-size:1.7cqw;line-height:1.45;color:#1d2a2d}
.phone p{margin:0;background:#9fe08a;border-radius:1cqw;padding:.6cqw .9cqw}
.phone p:nth-child(even){background:#fff;border:.12cqw solid #ccd}
.phone .app{font:700 1.2cqw var(--f-ui);color:#3f7f70;background:none;border:0;padding:0}
.chat{right:2.4cqw;top:31cqw;width:24cqw;display:grid;gap:.5cqw;opacity:0;transition:opacity .4s}
.chat.on{opacity:1}
.chat p{margin:0;background:#141c1ed0;color:#fff;font-family:var(--f-show);font-size:1.5cqw;padding:.4cqw .9cqw;border-radius:.8cqw}
.chat p b{color:#f6c14b;margin-right:.5cqw}
.zoomcard{top:8cqw;left:50%;transform:translateX(-50%) rotate(-2deg) scale(.7);background:#fffdf5;border:.3cqw solid #2b2626;border-radius:1cqw;padding:1.6cqw 3cqw;font-family:var(--f-show);font-size:3cqw;font-weight:700;color:#b8402c;text-align:center;box-shadow:0 1.4cqw 2.4cqw -1cqw #0007;opacity:0;transition:.45s;max-width:60cqw}
.zoomcard.on{opacity:1;transform:translateX(-50%) rotate(-2deg) scale(1)}
.zoomcard small{display:block;font-size:1.4cqw;color:#5d6466;font-weight:400}
.credits{inset:0;display:grid;place-content:center;justify-items:center;gap:1cqw;background:#f4ecd6;font-family:var(--f-show);color:#3a3a35;opacity:0;transition:opacity .6s;text-align:center;padding:4cqw}
.credits.on{opacity:1}
.credits h3{margin:0 0 1cqw;font-size:3.2cqw;color:#b8402c}
.credits p{margin:0;font-size:1.9cqw;line-height:1.5}
.credits p.fic{margin-top:1.4cqw;font-size:1.5cqw;color:#7b6c4e}
svg.world{transition:transform 1.1s ease;transform-origin:50% 50%}
.verse rt{font-size:.45em}
</style></style>

</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h1"></h1>
    <p id="hsub"></p>
  </header>
  <div class="stage" id="stage">
    <svg class="world" viewBox="0 0 1600 900" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe3ea"/><stop offset="1" stop-color="#f6f2e4"/></linearGradient>

<script>

const KIT2 = {};

KIT2.hairFront = function (st, c) {

    case 'short': return `<path d="M-37 0 Q-42 -44 0 -44 Q42 -44 37 0 Q34 -14 26 -20 L18 -12 L12 -22 L2 -12 L-6 -22 L-14 -12 L-22 -22 Q-34 -14 -37 0Z" fill="${c}" ${OL}/>`;
    case 'side': return `<path d="M-37 0 Q-42 -44 0 -44 Q42 -44 37 0 Q34 -20 20 -26 Q-10 -12 -30 -18 Q-36 -10 -37 0Z" fill="${c}" ${OL}/>`;
    case 'bob': case 'long': return `<path d="M-37 -2 Q-40 -44 0 -44 Q40 -44 37 -2 Q30 -22 0 -24 Q-30 -22 -37 -2Z" fill="${c}" ${OL}/>`;

    case 'bun': return cap + `<circle cx="0" cy="-48" r="14" fill="${c}" ${OL}/><path d="M-22 -54 L22 -44" stroke="#e3b341" stroke-width="4" stroke-linecap="round"/>`;

};
KIT2.hat = function (h, o) {

    case 'fangjin': return `<path d="M-38 -4 Q-40 -40 0 -42 Q40 -40 38 -4 Q0 -14 -38 -4Z" fill="${k}" ${OL}/><rect x="-30" y="-84" width="60" height="50" rx="5" fill="${k}" ${OL}/><rect x="-34" y="-42" width="68" height="10" rx="4" fill="#3a3a3a"/>`;
    case 'cap': return `<path d="M-39 -10 Q-38 -50 0 -50 Q38 -50 39 -10Z" fill="${o.capColor || '#e2533c'}" ${OL}/><path d="M8 -12 Q50 -16 60 -4 Q32 -2 8 -6Z" fill="${o.capColor || '#e2533c'}" ${OL}/>`;

};
KIT2.beard = function (b, c) {
  switch (b) {

    case 'short': return `<path d="M-24 10 Q-22 34 0 36 Q22 34 24 10 Q12 26 0 26 Q-12 26 -24 10Z" fill="${c || '#2a2420'}" opacity=".9"/><path d="M-14 9 q7 -5 14 0 q7 -5 14 0" stroke="${c || '#2a2420'}" stroke-width="4" fill="none" stroke-linecap="round"/>`;

};
KIT2.face = function (o) {
  const sk = o.skin || '#f3cfa8';
  const eyeOpen = (x) => `<ellipse cx="${x}" cy="-2" rx="6.5" ry="8" fill="#fff" stroke="#2b2626" stroke-width="2.5"/><circle cx="${x + 1}" cy="0" r="3.8" fill="#1d1d1f"/><circle cx="${x + 2.4}" cy="-2" r="1.2" fill="#fff"/>`;
  const browC = o.browColor || (o.beard === 'long' ? '#8f8b82' : '#2a2420');
  const d = o.blink != null ? o.blink : ((o.id.charCodeAt(0) * 7 + o.id.length * 13) % 40) / 10;
  return `
  <g class="eyes" style="animation-delay:-${d}s">
   <g class="e-norm">${eyeOpen(-13)}${eyeOpen(13)}</g>
   <g class="e-happy"><path d="M-20 0 q7 -9 14 0 M6 0 q7 -9 14 0" stroke="#1d1d1f" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>
   <g class="e-shock"><circle cx="-13" cy="-3" r="10" fill="#fff" stroke="#2b2626" stroke-width="2.5"/><circle cx="13" cy="-3" r="10" fill="#fff" stroke="#2b2626" stroke-width="2.5"/><circle cx="-13" cy="-3" r="3" fill="#1d1d1f"/><circle cx="13" cy="-3" r="3" fill="#1d1d1f"/></g>
   <g class="e-proud"><path d="M-20 -2 h14 M6 -2 h14" stroke="#1d1d1f" stroke-width="3.5" stroke-linecap="round"/><path d="M-19 -2 q6 7 12 0 M7 -2 q6 7 12 0" fill="#1d1d1f"/></g>
   <g class="e-shy"><path d="M-20 -3 q7 7 14 0 M6 -3 q7 7 14 0" stroke="#1d1d1f" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>
   <g class="e-think"><ellipse cx="-13" cy="-2" rx="6.5" ry="8" fill="#fff" stroke="#2b2626" stroke-width="2.5"/><ellipse cx="13" cy="-2" rx="6.5" ry="8" fill="#fff" stroke="#2b2626" stroke-width="2.5"/><circle cx="-10" cy="-6" r="3.6" fill="#1d1d1f"/><circle cx="16" cy="-6" r="3.6" fill="#1d1d1f"/></g>
  </g>
  ${o.glasses ? `<g fill="none" stroke="#2b2626" stroke-width="3"><circle cx="-13" cy="-2" r="11"/><circle cx="13" cy="-2" r="11"/><path d="M-2 -3 h4"/></g>` : ''}
  <g stroke="${browC}" stroke-width="4.5" stroke-linecap="round" fill="none">
   <path class="b-norm" d="M-21 -15 l12 -2 M9 -17 l12 2"/>
   <path class="b-sad" d="M-21 -13 l12 -5 M9 -18 l12 5"/>
   <path class="b-angry" d="M-21 -20 l13 6 M8 -14 l13 -6"/>
   <path class="b-think" d="M-21 -15 l12 -2 M9 -21 l12 -3"/>
  </g>
  <ellipse cx="-24" cy="10" rx="6" ry="4" fill="#f2a7a0" opacity=".5"/><ellipse cx="24" cy="10" rx="6" ry="4" fill="#f2a7a0" opacity=".5"/>
  <g class="xt x-blush"><ellipse cx="-23" cy="9" rx="9" ry="6" fill="#ee6b6b" opacity=".7"/><ellipse cx="23" cy="9" rx="9" ry="6" fill="#ee6b6b" opacity=".7"/></g>
  <path d="M0 3 q-3 5 1 6" stroke="#c99a78" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  ${KIT2.beard(o.beard, o.beardColor)}
  <g class="mouth">
   <path class="mth m0" d="M-7 15 q7 5 14 0" stroke="#7a3a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
   <ellipse class="mth m1" cx="0" cy="17" rx="6" ry="4" fill="#7a2f22" stroke="#2b2626" stroke-width="2"/>
   <path class="mth m2" d="M-9 13 q9 -2 18 0 q-2 13 -9 13 q-7 0 -9 -13z" fill="#7a2f22" stroke="#2b2626" stroke-width="2"/>
   <path class="mo mo-happy" d="M-10 12 q10 2 20 0 q-3 11 -10 11 q-7 0 -10 -11z" fill="#7a2f22" stroke="#2b2626" stroke-width="2"/>
   <path class="mo mo-sad" d="M-7 20 q7 -7 14 0" stroke="#7a3a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
   <ellipse class="mo mo-shock" cx="0" cy="19" rx="5" ry="7" fill="#7a2f22" stroke="#2b2626" stroke-width="2"/>
   <path class="mo mo-angry" d="M-8 18 h16" stroke="#7a3a2a" stroke-width="3.5" stroke-linecap="round"/>
   <path class="mo mo-proud" d="M-7 17 q9 4 14 -4" stroke="#7a3a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g class="xt x-tear"><path class="tear2" d="M-16 6 q-5 9 0 13 q5 -4 0 -13z" fill="#5fb0e0"/><path class="tear2" style="animation-delay:-.5s" d="M16 6 q-5 9 0 13 q5 -4 0 -13z" fill="#5fb0e0"/></g>
  <g class="xt x-sweat"><path d="M40 -26 q-7 13 0 18 q7 -5 0 -18z" fill="#7cc4ea" ${OL}/></g>
  <g class="xt x-steam" fill="#fff" opacity=".9"><circle class="steam2" cx="-34" cy="-56" r="12"/><circle class="steam2" style="animation-delay:-.5s" cx="34" cy="-56" r="10"/></g>
  <g class="xt x-spark" fill="#f6c14b"><path d="M48 -40 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" ${OL}/></g>
  <g class="xt x-q"><text x="44" y="-34" font-size="34" font-weight="900" fill="#3f7f70" font-family="sans-serif">?</text></g>`;
};
/* 手上的道具：畫在手的位置（原點＝手心） */
KIT2.prop = {
  phone: `<rect x="-9" y="-16" width="18" height="30" rx="4" fill="#222" ${OL}/><rect x="-6" y="-12" width="12" height="20" fill="#7cc4ea"/>`,
  book: `<rect x="-20" y="-14" width="40" height="28" rx="2" fill="#c8a35a" ${OL}/><path d="M0 -14 V14" stroke="#2b2626" stroke-width="2"/>`,
  scroll: `<rect x="-6" y="-26" width="12" height="52" rx="5" fill="#efe2c4" ${OL}/>`,

  tablet: `<rect x="-20" y="-26" width="40" height="52" rx="5" fill="#333" ${OL}/><rect x="-15" y="-20" width="30" height="40" fill="#bfe3ef"/>`,

  brush: `<path d="M0 -30 V20" stroke="#6b4224" stroke-width="5"/><path d="M-4 20 L4 20 L0 34Z" fill="#222"/>`
};
/* 主角色產生器 */
KIT2.person = function (o) {
  const skin = o.skin || '#f3cfa8', hair = o.hair || '#2a2420', shoe = o.shoe || '#2b2b2b';
  const child = o.age === 'child';

  // 腿
  const leg = (side) => {
    const body = anc
      ? `<rect x="-9" y="-4" width="18" height="92" rx="9" fill="${o.legColor || '#e9e1cc'}" ${OL}/>`
      : `<path d="M-12 -6 Q-13 40 -11 90 Q0 95 11 90 Q13 40 12 -6 Q0 -10 -12 -6Z" fill="${o.skirt ? skin : pants}" ${OL}/>`;

  const arm = (side) => {

      ? `<circle r="14" fill="${sleeve}"/><path d="M-12 -6 C-13 14 -16 34 -17 52 Q0 60 17 52 C16 34 13 14 12 -6 Q0 -14 -12 -6Z" fill="${sleeve}" ${OL}/>`

        : `<path d="M-8 14 Q-9 34 -8 56 Q0 60 8 56 Q9 34 8 14Z" fill="${skin}" ${OL}/><circle r="12" fill="${o.sleeveColor || top}"/><path d="M-13 -6 Q-15 12 -13 27 Q0 32 13 27 Q15 12 13 -6 Q0 -13 -13 -6Z" fill="${o.sleeveColor || top}" ${OL}/>`);
    const fore = anc
      ? `<circle cx="0" cy="47" r="10" fill="${skin}" ${OL}/><path d="M-17 -10 C-20 8 -23 26 -23 41 Q0 53 23 41 C23 26 20 8 17 -10 Q0 -18 -17 -10Z" fill="${sleeve}" ${OL}/><circle cy="-4" r="13" fill="${sleeve}"/>`
      : `<path d="M-8 -10 Q-9 18 -7 44 Q0 48 7 44 Q9 18 8 -10 Q0 -15 -8 -10Z" fill="${o.longSleeve ? (o.sleeveColor || top) : skin}" ${OL}/><circle cy="-4" r="7" fill="${o.longSleeve ? (o.sleeveColor || top) : skin}"/><circle cx="0" cy="47" r="10" fill="${skin}" ${OL}/>`;
    const p = side > 0 ? o.hand : o.handL;
    const prop = p ? (KIT2.prop[p] || p) : '';
    return `<g transform="translate(${side * 42} -212)"><g class="u${side < 0 ? 'L' : 'R'}">${upper}<g transform="translate(0 50)"><g class="f${side < 0 ? 'L' : 'R'}">${fore}<g transform="translate(0 46)">${prop}</g></g></g></g></g>`;
  };
  // 身體
  let torso;
  if (anc) {
    const collar = o.collar === 'cross'
      ? `<path d="M-22 -224 L12 -170 M22 -224 L-4 -196" stroke="${o.collarColor || '#efe6d0'}" stroke-width="7" fill="none"/>`
      : `<path d="M-20 -226 Q0 -204 20 -226" stroke="${o.collarColor || '#efe6d0'}" stroke-width="7" fill="none"/>`;
    torso = `<path d="M-40 -228 Q0 -240 40 -228 C48 -170 56 -90 62 -14 Q0 2 -62 -14 C-56 -90 -48 -170 -40 -228Z" fill="${robe}" ${OL}/>${collar}
      <rect x="-46" y="-156" width="92" height="12" rx="4" fill="${o.belt || '#3e5058'}" ${OL}/>
      <path d="M-58 -26 Q0 -16 58 -26" stroke="${o.trim || '#0002'}" stroke-width="6" fill="none"/>`;
  } else {
    const t = o.topStyle || 'tee';
    let base = `<path d="M-38 -228 Q0 -238 38 -228 C42 -190 45 -140 44 -106 Q0 -96 -44 -106 C-45 -140 -42 -190 -38 -228Z" fill="${top}" ${OL}/>`;
    let deco = '';
    if (t === 'tee') deco = `<path d="M-14 -228 Q0 -214 14 -228" stroke="#2b2626" stroke-width="3" fill="none"/>`;
    if (t === 'shirt') deco = `<path d="M-14 -228 L0 -206 L14 -228" stroke="#fff" stroke-width="6" fill="none"/><path d="M0 -206 V-110" stroke="#2b2626" stroke-width="2"/>`;
    if (t === 'hoodie') deco = `<path d="M-30 -232 Q0 -250 30 -232" stroke="${top}" stroke-width="14" fill="none"/><rect x="-24" y="-150" width="48" height="26" rx="6" fill="#0002"/>`;
    if (t === 'vest') deco = `<path d="M-36 -224 L-6 -224 L-8 -106 L-42 -106Z" fill="${o.vest || '#7a8c4e'}" ${OL}/><path d="M36 -224 L6 -224 L8 -106 L42 -106Z" fill="${o.vest || '#7a8c4e'}" ${OL}/>`;
    if (t === 'coat') base = `<path d="M-40 -226 Q0 -234 40 -226 L50 -50 Q0 -42 -50 -50Z" fill="${top}" ${OL}/>`, deco = `<path d="M0 -226 V-50" stroke="#2b2626" stroke-width="2.5"/><path d="M-16 -228 L0 -200 L16 -228" stroke="${o.inner || '#9cc3e6'}" stroke-width="8" fill="none"/>`;
    if (t === 'uniform') deco = `<path d="M-14 -228 L0 -206 L14 -228" stroke="#fff" stroke-width="6" fill="none"/><path d="M0 -206 l-6 12 6 40 6 -40z" fill="#c8372b"/>`;
    if (t === 'apron') deco = `<path d="M-30 -200 L30 -200 L36 -80 L-36 -80Z" fill="${o.apron || '#7da3c6'}" ${OL}/>`;
    torso = base + deco + (o.skirt ? `<path d="M-46 -110 L46 -110 L60 -40 L-60 -40Z" fill="${pants}" ${OL}/>` : `<rect x="-44" y="-112" width="88" height="26" fill="${pants}" ${OL}/>`);
  }
  const back = (o.backpack ? `<rect x="-52" y="-212" width="104" height="100" rx="18" fill="${o.backpack}" ${OL}/>` : '')
    + (o.bookbox ? `<g transform="translate(-34 -150)"><rect x="-30" y="-130" width="60" height="140" rx="4" fill="#a8743c" ${OL}/><path d="M-30 -96 h60 M-30 -56 h60" stroke="#6b4224" stroke-width="3"/></g>` : '')
    + (o.hatOnBack ? `<ellipse cx="0" cy="-180" rx="66" ry="56" fill="#dcc17a" ${OL}/>` : '');
  const head = o.back
    ? `<circle r="36" fill="${skin}" ${OL}/>${KIT2.hairBack(o.hairStyle, hair)}<circle r="36" fill="${hair}" ${OL}/>${KIT2.hat(o.hat, o)}`
    : `${o.hat === 'futou' ? `<path d="M-16 -20 Q-34 14 -30 ${o.tails ? 66 : 40} M16 -20 Q34 14 30 ${o.tails ? 66 : 40}" stroke="#1d1d1f" stroke-width="8" fill="none" stroke-linecap="round"/>` : ''}
       ${KIT2.hairBack(o.hairStyle, hair)}
       <circle cx="-36" cy="2" r="8" fill="${skin}" ${OL}/><circle cx="36" cy="2" r="8" fill="${skin}" ${OL}/>
       <circle r="36" fill="${skin}" ${OL}/>
       ${o.hat && !['cap', 'bucket', 'douli', 'driver', 'headlamp'].includes(o.hat) ? '' : KIT2.hairFront(o.hairStyle, hair)}
       ${KIT2.hat(o.hat, o)}
       ${KIT2.face(o)}`;
  const hs = child ? 1.2 : 1;
  return `<g class="ch" id="c-${o.id}"><g transform="scale(${s})"><g class="bod">
    ${back}${leg(-1)}${leg(1)}
    ${o.bodyBack || ''}
    ${torso}
    ${o.bodyExtra || ''}
    <rect x="-9" y="-238" width="18" height="16" fill="${skin}"/>
    ${arm(-1)}${arm(1)}
    <g transform="translate(0 -264) scale(${hs})"><g class="hd">${head}</g></g>
  </g></g></g>`;
};
/* 柴犬 */
KIT2.dog = function (o) {
  return `<g class="ch dog" id="c-${o.id}"><g transform="scale(${o.scale || 1})"><g class="bod">
   <g transform="translate(-52 -70)"><path class="tail" d="M0 0 q-30 -10 -22 -40 q16 6 14 30" fill="#d9893e" ${OL}/></g>
   <ellipse cx="0" cy="-58" rx="56" ry="30" fill="#d9893e" ${OL}/>
   <g fill="#d9893e" ${OL}><rect x="-44" y="-40" width="14" height="40" rx="6"/><rect x="-20" y="-40" width="14" height="40" rx="6"/><rect x="18" y="-40" width="14" height="40" rx="6"/><rect x="36" y="-40" width="14" height="40" rx="6"/></g>
   <g transform="translate(52 -96)"><path d="M-20 -22 L-14 -46 L-2 -26Z M8 -26 L18 -46 L24 -20Z" fill="#d9893e" ${OL}/><circle r="28" fill="#d9893e" ${OL}/><ellipse cx="6" cy="12" rx="18" ry="13" fill="#fff4e6"/><circle cx="-8" cy="-4" r="3.5" fill="#1d1d1f"/><circle cx="14" cy="-4" r="3.5" fill="#1d1d1f"/><circle cx="10" cy="8" r="4" fill="#1d1d1f"/></g>
   <path d="M30 -72 q22 6 40 -2" stroke="#c8372b" stroke-width="6" fill="none"/>
  </g></g></g>`;
};

/* ===== 場景零件（1600×900，y 往下變大） ===== */
KIT2.bg = {
  sky: (c1, c2) => { const id = 'g' + Math.random().toString(36).slice(2, 8); return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1 || '#cfe3ea'}"/><stop offset="1" stop-color="${c2 || '#f6f2e4'}"/></linearGradient></defs><rect width="1600" height="900" fill="url(#${id})"/>`; },
  hills: (y, c, a) => { a = a || 60; return `<path d="M0 ${y} C200 ${y - a} 400 ${y + a * .4} 600 ${y - a * .6} S1000 ${y + a * .3} 1200 ${y - a * .8} S1500 ${y} 1600 ${y - a * .4} V900 H0Z" fill="${c || '#a6bdb5'}"/>`; },
  peak: (x, y, w, h, c) => `<path d="M${x - w / 2} ${y} L${x} ${y - h} L${x + w / 2} ${y}Z" fill="${c || '#9fb5aa'}"/>`,
  ground: (y, c) => `<rect y="${y}" width="1600" height="${900 - y}" fill="${c || '#d9c49a'}"/>`,
  water: (y, c, h) => `<rect y="${y}" width="1600" height="${h || 900 - y}" fill="${c || '#7fb3c4'}"/><g stroke="#e8f5fa" stroke-width="4" fill="none" opacity=".6"><path d="M120 ${y + 40} q30 -10 60 0 M640 ${y + 70} q30 -10 60 0 M1200 ${y + 50} q30 -10 60 0 M380 ${y + 110} q30 -10 60 0 M980 ${y + 120} q30 -10 60 0"/></g>`,
  sun: (x, y, r, c) => `<circle cx="${x}" cy="${y}" r="${r || 70}" fill="${c || '#f6c14b'}"/>`,
  moon: (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r || 50}" fill="#f6f0c8"/><circle cx="${x + 14}" cy="${y - 8}" r="${(r || 50) * .2}" fill="#e9e0b0"/>`,
  cloud: (x, y, s, c) => `<g transform="translate(${x} ${y}) scale(${s || 1})" fill="${c || '#fff'}" opacity=".92"><ellipse cx="0" cy="0" rx="90" ry="34"/><ellipse cx="-50" cy="10" rx="60" ry="26"/><ellipse cx="60" cy="8" rx="64" ry="28"/></g>`,
  stars: (n, h) => { let s = ''; for (let i = 0; i < (n || 50); i++) s += `<circle cx="${(i * 173) % 1600}" cy="${(i * 97) % (h || 480)}" r="${1.5 + i % 3}" fill="#fff" opacity="${.5 + (i % 5) / 10}"/>`; return s; },
  tree: (x, y, s, leaf) => `<g transform="translate(${x} ${y}) scale(${s || 1})"><rect x="-12" y="-200" width="24" height="200" fill="#6d4e32" ${OL}/><g fill="${leaf || '#5f9a5a'}" ${OL}><circle cx="-60" cy="-180" r="60"/><circle cx="60" cy="-190" r="64"/><circle cx="0" cy="-230" r="88"/></g></g>`,
  pine: (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s || 1})"><rect x="-10" y="-60" width="20" height="60" fill="#6d4e32"/><g fill="#3f6e4a" ${OL}><path d="M-70 -50 L0 -150 L70 -50Z"/><path d="M-56 -110 L0 -200 L56 -110Z"/><path d="M-40 -170 L0 -250 L40 -170Z"/></g></g>`,
  bamboo: (x, y, h, n) => { let s = ''; for (let i = 0; i < (n || 6); i++) { const bx = x + i * 34, bh = h - (i % 3) * 40; s += `<rect x="${bx}" y="${y - bh}" width="14" height="${bh}" fill="#6fa35a" ${OL}/>`; for (let k = 1; k < 5; k++) s += `<path d="M${bx} ${y - bh * k / 5} h14" stroke="#2b2626" stroke-width="2"/>`; s += `<path d="M${bx + 7} ${y - bh * .7} q30 -20 50 -10 M${bx + 7} ${y - bh * .45} q-30 -20 -50 -6" stroke="#4f8a45" stroke-width="8" fill="none" stroke-linecap="round"/>`; } return s; },
  maple: (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s || 1})"><rect x="-10" y="-180" width="20" height="180" fill="#5a3d28"/><g fill="#c8442c" ${OL}><circle cx="-50" cy="-170" r="54"/><circle cx="50" cy="-176" r="58"/><circle cx="0" cy="-220" r="74"/></g></g>`,
  house: (x, y, s, roof, wall) => `<g transform="translate(${x} ${y}) scale(${s || 1})"><rect x="-150" y="-180" width="300" height="180" fill="${wall || '#f3ecdc'}" ${OL}/><path d="M-180 -170 L0 -260 L180 -170Z" fill="${roof || '#5a5e63'}" ${OL}/><rect x="-35" y="-110" width="70" height="110" fill="#8b5e3c" ${OL}/><rect x="-120" y="-130" width="60" height="50" fill="#cfe3ea" ${OL}/><rect x="60" y="-130" width="60" height="50" fill="#cfe3ea" ${OL}/></g>`,
  building: (x, y, w, h, c, win) => { let s = `<rect x="${x}" y="${y - h}" width="${w}" height="${h}" fill="${c || '#b9c3c9'}" ${OL}/>`; for (let r = y - h + 24; r < y - 30; r += 46) for (let q = x + 18; q < x + w - 30; q += 44) s += `<rect x="${q}" y="${r}" width="24" height="26" fill="${win || '#e6f1f5'}"/>`; return s; },
  temple: (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s || 1})"><rect x="-90" y="-80" width="180" height="80" fill="#c8513c" ${OL}/><path d="M-140 -70 Q-120 -82 -110 -110 L110 -110 Q120 -82 140 -70 Z" fill="#3c3c3c" ${OL}/><path d="M-100 -110 Q0 -150 100 -110" fill="#3c3c3c" ${OL}/><rect x="-24" y="-60" width="48" height="60" fill="#5a2d1e"/></g>`,
  bell: (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s || 1})"><path d="M-30 0 Q-30 -60 0 -64 Q30 -60 30 0Z" fill="#7a6a3a" ${OL}/><path d="M-36 0 h72" stroke="#2b2626" stroke-width="5"/></g>`,
  lamp: (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s || 1})"><rect x="-5" y="-260" width="10" height="260" fill="#4a5560"/><path d="M-5 -256 q30 -10 40 6" stroke="#4a5560" stroke-width="8" fill="none"/><ellipse cx="36" cy="-246" rx="16" ry="8" fill="#fff3b0" ${OL}/></g>`,
  rail: (y, c) => `<g stroke="${c || '#6b5a4a'}" stroke-width="6"><path d="M0 ${y} H1600"/><path d="M0 ${y - 36} H1600" stroke-width="5"/></g><g stroke="${c || '#6b5a4a'}" stroke-width="4">${Array.from({ length: 33 }, (_, i) => `<path d="M${i * 50} ${y - 50} V${y}"/>`).join('')}</g>`,
  sign: (x, y, text, w, c, tc) => `<g transform="translate(${x} ${y})"><rect x="${-(w || 260) / 2}" y="-44" width="${w || 260}" height="64" rx="8" fill="${c || '#6b4224'}" ${OL}/><text y="0" text-anchor="middle" font-size="36" font-weight="700" fill="${tc || '#fff6d8'}" font-family="var(--f-show)">${text}</text></g>`,
  window: (x, y, w, h, inner) => `<g transform="translate(${x} ${y})"><rect width="${w}" height="${h}" rx="18" fill="#6b7a85" ${OL}/><rect x="14" y="14" width="${w - 28}" height="${h - 28}" rx="12" fill="#bfe3ef"/><g clip-path="none">${inner || ''}</g></g>`,
  seats: (y, c) => `<g fill="${c || '#3f6e9a'}" ${OL}>${[80, 420, 1000, 1340].map(x => `<rect x="${x}" y="${y}" width="200" height="120" rx="16"/><rect x="${x}" y="${y - 140}" width="40" height="160" rx="12"/>`).join('')}</g>`,
  rice: (y) => { let s = `<rect y="${y}" width="1600" height="${900 - y}" fill="#8fbccc"/>`; for (let r = 0; r < 6; r++) for (let i = 0; i < 18; i++) s += `<path d="M${i * 92 + (r % 2) * 46} ${y + 30 + r * 34} l-6 -22 M${i * 92 + (r % 2) * 46} ${y + 30 + r * 34} l6 -20 M${i * 92 + (r % 2) * 46} ${y + 30 + r * 34} l0 -24" stroke="#6d9a46" stroke-width="3"/>`; return s; },
  egret: (x, y, s, fly) => fly
    ? `<g transform="translate(${x} ${y}) scale(${s || 1})"><path d="M-40 0 q40 -10 80 0 q-40 10 -80 0z" fill="#fff" ${OL}/><path class="wing" d="M-6 -2 q-20 -50 -50 -56 q14 34 30 56z" fill="#fff" ${OL}/><path d="M40 0 l22 -4 -22 8z" fill="#e5b33c"/><path d="M-40 2 l-30 6" stroke="#222" stroke-width="3"/></g>`
    : `<g transform="translate(${x} ${y}) scale(${s || 1})"><path d="M0 -60 q30 -10 30 20 q0 30 -30 34 q-26 -4 -24 -30 q2 -20 24 -24z" fill="#fff" ${OL}/><path d="M18 -58 q14 -40 0 -70 q-10 -6 -14 6 q12 24 -2 50" fill="#fff" ${OL}/><path d="M6 -126 l30 4 -30 4z" fill="#e5b33c" ${OL}/><circle cx="6" cy="-126" r="2.5" fill="#222"/><path d="M-4 -6 V40 M10 -6 V40" stroke="#222" stroke-width="3"/></g>`,
  crow: (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s || 1})"><ellipse rx="22" ry="14" fill="#222"/><circle cx="20" cy="-10" r="10" fill="#222"/><path d="M28 -10 l12 2 -12 4z" fill="#555"/><path d="M-20 0 l-16 8" stroke="#222" stroke-width="6"/></g>`,
  monkey: (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s || 1})"><ellipse cx="0" cy="0" rx="22" ry="26" fill="#8a6a4a" ${OL}/><circle cx="0" cy="-34" r="20" fill="#8a6a4a" ${OL}/><ellipse cx="0" cy="-30" rx="13" ry="11" fill="#e8b49a"/><circle cx="-5" cy="-34" r="2.5" fill="#222"/><circle cx="5" cy="-34" r="2.5" fill="#222"/><ellipse class="mky" cx="0" cy="-24" rx="4" ry="3" fill="#6b2a1e"/><path d="M20 10 q30 10 26 -30" stroke="#8a6a4a" stroke-width="6" fill="none"/></g>`,
  firefly: (x, y, d) => `<g transform="translate(${x} ${y})"><circle class="ffly" style="animation-delay:-${d || 0}s" r="7" fill="#e9ff7a"/></g>`,
  cicada: (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s || 1})"><ellipse rx="12" ry="26" fill="#5a4a2a" ${OL}/><path d="M-10 -10 q-28 30 -12 50 M10 -10 q28 30 12 50" fill="#cfe8f0" opacity=".8" stroke="#2b2626" stroke-width="2"/><circle cx="-7" cy="-24" r="4" fill="#222"/><circle cx="7" cy="-24" r="4" fill="#222"/><path d="M0 -20 v14" stroke="#c99a5a" stroke-width="3"/></g>`,
  swallow: (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s || 1})"><path d="M-30 0 q30 -8 50 0 q-20 8 -50 0z" fill="#1f2a44"/><path class="wing" d="M-4 -2 q-10 -36 -36 -40 q8 24 22 42z" fill="#1f2a44"/><path d="M-30 0 l-20 -10 M-30 0 l-20 8" stroke="#1f2a44" stroke-width="4"/><circle cx="16" cy="-1" r="3" fill="#c8372b"/></g>`,
  duck: (x, y, s, male) => `<g transform="translate(${x} ${y}) scale(${s || 1})"><ellipse rx="40" ry="22" fill="${male ? '#c8742c' : '#9a8266'}" ${OL}/><circle cx="34" cy="-20" r="16" fill="${male ? '#3f6e4a' : '#9a8266'}" ${OL}/>${male ? '<path d="M24 -30 q20 -10 30 6" stroke="#fff" stroke-width="5" fill="none"/>' : ''}<path d="M48 -18 l12 2 -12 4z" fill="#e2533c"/><path d="M30 -22 q4 4 8 0" stroke="#222" stroke-width="2.5" fill="none"/></g>`,
  phoneBig: (msg) => `<g><rect x="-110" y="-200" width="220" height="400" rx="26" fill="#1d1d1f"/><rect x="-96" y="-176" width="192" height="340" rx="10" fill="#f3f7f9"/></g>`,
  paperTitle: () => `<rect width="1600" height="900" fill="#f4ecd6"/><g opacity=".25" fill="#6b7f78"><path d="M0 700 Q200 520 360 640 T720 600 T1080 640 T1600 560 V900 H0Z"/><path d="M0 780 Q300 640 560 740 T1100 720 T1600 700 V900 H0Z" opacity=".7"/></g>`
};

/* 背誦挑戰（不用樂樂悠悠，由旁白帶） */
KIT2.recite = function (o) {
  const T = g => g.map(i => o.lines[i]).join('');
  const r = [{ ch: o.ch, scene: 'poem', w: 'n', t: o.intro, rv: { m: 0 } }, { w: 'n', t: '第一輪，看著詩，跟著唸。', rv: { m: 0 } }];
  o.groups.forEach(g => r.push({ w: 'n', t: T(g), poem: g, rv: { m: 0, hl: g } }));
  r.push({ w: 'n', t: '第二輪，有些字躲起來了！你還記得嗎？一起唸！', rv: { m: 1 } });
  o.groups.forEach(g => r.push({ w: 'a', t: T(g), poem: g, rv: { m: 1, hl: g } }));
  r.push({ w: 'n', t: '最後一輪，只剩每一句的第一個字。換你們自己大聲背！', rv: { m: 2 }, wait: o.wait || 20 });
  r.push({ w: 'n', t: '答案揭曉！再一起唸一遍。', rv: { m: 0 } });
  o.groups.forEach(g => r.push({ w: 'a', t: T(g), poem: g, rv: { m: 0, hl: g } }));
  r.push({ w: 'a', t: o.outro, rv: { m: 0 } });
  return r;
};

KIT2.poemScene = `<g class="scene" data-scene="poem"><rect width="1600" height="900" fill="#e7efe9"/><path d="M0 760 C300 700 520 740 800 710 S1300 700 1600 680 V900 H0Z" fill="#b9d0c6"/><use href="#flyer" class="fly" y="120"/></g>`;

/* ===== 固定角色（同一個人在不同部長得一樣） ===== */
KIT2.CAST = {
  libai: { kind: 'ancient', robe: '#f4f1e8', sleeve: '#4f78b0', belt: '#3a5a8a', collarColor: '#4f78b0', hairStyle: 'bun', beard: 'mous', bookbox: true },
  zhangji: { kind: 'ancient', robe: '#7f97a8', belt: '#3e5058', hat: 'futou', beard: 'short' },
  wangzhihuan: { kind: 'ancient', robe: '#4f7f5a', belt: '#2f4a34', hat: 'futou', beard: 'goatee', bodyExtra: `<g transform="translate(30 -150) rotate(70)"><rect x="-4" y="-50" width="9" height="100" rx="4" fill="#c8a35a" stroke="#2b2626" stroke-width="2.5"/></g>` },
  yushinan: { kind: 'ancient', age: 'elder', robe: '#6a4a86', belt: '#3c2a4e', hat: 'futou', tails: true, beard: 'long', browColor: '#9a968c', hand: 'brush' },
  dufu: { kind: 'ancient', robe: '#8a6a4a', sleeve: '#7a5c3e', belt: '#4a3626', collarColor: '#d9ccb0', hat: 'wrap', wrapColor: '#4f4034', beard: 'long', beardColor: '#6f6a62', scale: .97 },
  liuchangqing: { kind: 'ancient', robe: '#3e5f8a', belt: '#22344e', hat: 'futou', beard: 'eight' },
  lingche: { kind: 'ancient', robe: '#8d8d86', belt: '#5d5d58', collar: 'cross', collarColor: '#c8742c', hairStyle: 'bald', hatOnBack: true, hand: 'scroll' },
  weiyingwu: { kind: 'ancient', robe: '#b8bcc0', belt: '#5d6670', hat: 'futou', beard: 'mous' },
  zhuxi: { kind: 'ancient', robe: '#efe6d0', sleeve: '#e6dcc2', belt: '#3a3a3a', collar: 'cross', collarColor: '#3a3a3a', hat: 'fangjin', beard: 'long', beardColor: '#3a3430', hand: 'book' }
};
KIT2.make = (preset, o) => KIT2.person(Object.assign({}, KIT2.CAST[preset] || {}, o));
/* 畫在場景裡、不會說話的人（背影皇帝、家人、乘客） */

  const stage = $('stage'), sub = $('sub'), verse = $('verse'), scroll = $('scroll'), tracker = $('tracker'), count = $('count');

    for (let k = s; k <= i; k++) {
      const b = B[k];

      if (b.props) st.props = b.props;
      if (b.cls) st.cls = b.cls;
      if (b.mood) Object.assign(st.mood, b.mood);
      if (b.g && k >= i - 1) Object.assign(st.g, b.g);
      if ('phone' in b) st.phone = b.phone;
      if (b.chat) st.chat = st.chat.concat(b.chat);
      if ('card' in b) st.card = b.card;
      if ('cam' in b) st.cam = b.cam;

      stageCls.forEach(c => stage.classList.add('fx-' + c));

      if (st.card) { $('zoomcard').innerHTML = st.card; $('zoomcard').classList.add('on'); } else $('zoomcard').classList.remove('on');

    timers.push(setTimeout(tick, 1000));
  }

    beats: B.map((b, i) => ({ i, who: b.w, name: WHO[b.w].name, text: b.t, say: ttsText(b), tts: WHO[b.w].tts, wait: b.wait || 0, silent: !!b.silent, hold: b.hold || 0, tickMs: 0, sceneChange: i === 0 || B[i - 1].scene !== b.scene })),
